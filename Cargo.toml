[package]
name = "teehee"
version = "0.1.0"
edition = "2021"
description = "Stream Windows system audio to a Mac over UDP"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "teehee"
path = "src/main.rs"

[dependencies]
cpal = "0.15"
clap = { version = "4", features = ["derive"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

# Slice 8 (Tier 3 #1) — Windows-only WASAPI loopback capture. Conditional on
# target_os = "windows" so macOS/Linux builds are unaffected. The Rust API
# exposure is via `teehee::loopback::LoopbackCapturer` (re-exported as
# `teehee::audio_io::LoopbackCapturer`); non-Windows targets see the same
# surface but `LoopbackCapturer::open_default` returns Err with a clear
# "WASAPI loopback is Windows-only" message. Backed by the `wasapi` crate
# (HEnquist/wasapi-rs) — see https://docs.rs/wasapi/0.23.
[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.23"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
