# Fast quality gates for PRs and branch pushes.
# Expensive release packaging lives in release.yml (main / tags / manual).
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Parallel front-end; backend still serialized by codegen-units in release profile.
  CARGO_TERM_PROGRESS_WHEN: never

jobs:
  # One Linux job for fmt + clippy: one cold toolchain install, shared cache.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  # GUI prototype: NSH's own ci.yml runs check/build/test the same way.
  # Uses the same pinned NSH release as the packaging job in release.yml.
  gui:
    name: gui (check, build, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gui-ci

      # QuickJS is C (bindgen needs libclang); the Linux backend links
      # GTK 4 and GStreamer. Matches NSH's own CI dependency list.
      - name: Install NSH build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libgtk-4-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Install NSH CLI
        env:
          NSH_VERSION: v0.6.0
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: nsh check
        run: nsh check gui

      - name: nsh build
        run: nsh build gui

      - name: nsh test
        run: nsh test gui

  # Debug tests only (fast). Release binaries are produced by release.yml.
  # Full OS matrix: cpal/WASAPI paths differ per platform.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - name: Install system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Test
        run: cargo test --locked --workspace

      - name: Log rotation regression tests
        if: runner.os == 'Windows'
        run: powershell -NoProfile -File tests/rotate_logs_tests.ps1
