# Multi-platform release binaries (Linux, macOS arm64+x86_64, Windows).
#
# Triggers:
#   - version tags vX.Y.Z  → build all targets + draft GitHub Release
#   - workflow_dispatch    → same builds as artifacts (optional draft release off)
#
# Not run on PR or ordinary branch pushes — that stays in ci.yml (fast/cheap).
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_PROGRESS_WHEN: never

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            rust_targets: x86_64-unknown-linux-gnu
            binary: teehee
            archive: tar
          # One macos-latest (arm64) runner builds Apple Silicon + Intel.
          - name: macos
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            binary: teehee
            archive: tar
          - name: windows-x86_64
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            binary: teehee.exe
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version label
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}
          cache-all-crates: true

      - name: Install system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build release targets
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a targets <<< "${{ matrix.rust_targets }}"
          for target in "${targets[@]}"; do
            echo "::group::cargo build --release --locked --target ${target}"
            cargo build --release --locked --target "${target}"
            echo "::endgroup::"
          done

      - name: Package archives
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p dist
          IFS=',' read -r -a targets <<< "${{ matrix.rust_targets }}"
          for target in "${targets[@]}"; do
            src="target/${target}/release/${{ matrix.binary }}"
            if [[ ! -f "${src}" ]]; then
              echo "missing binary: ${src}" >&2
              exit 1
            fi
            if [[ "${{ matrix.archive }}" == "tar" ]]; then
              out="dist/teehee-${VERSION}-${target}.tar.gz"
              tar -C "target/${target}/release" -czf "${out}" "${{ matrix.binary }}"
            else
              out="dist/teehee-${VERSION}-${target}.zip"
              if command -v zip >/dev/null 2>&1; then
                (cd "target/${target}/release" && zip -9 "../../../${out}" "${{ matrix.binary }}")
              else
                pwsh -NoProfile -Command \
                  "Compress-Archive -Path '${src}' -DestinationPath '${out}' -Force"
              fi
            fi
            echo "packed ${out}"
          done

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum teehee-* > SHA256SUMS.txt
          else
            shasum -a 256 teehee-* > SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: teehee-${{ steps.meta.outputs.version }}-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release assets
        run: ls -la artifacts

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*
