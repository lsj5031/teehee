# Multi-platform release binaries (Linux, macOS arm64+x86_64, Windows).
#
# Triggers:
#   - version tags vX.Y.Z  → build all targets + publish GitHub Release
#   - workflow_dispatch    → same builds as Actions artifacts only
#
# Not run on PR or ordinary branch pushes — that stays in ci.yml (fast/cheap).
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_PROGRESS_WHEN: never

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            rust_targets: x86_64-unknown-linux-gnu
            binary: teehee
            archive: tar
          # One macos-latest (arm64) runner builds Apple Silicon + Intel.
          - name: macos
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            binary: teehee
            archive: tar
          - name: windows-x86_64
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            binary: teehee.exe
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version label
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}
          cache-all-crates: true

      - name: Install system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build release targets
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a targets <<< "${{ matrix.rust_targets }}"
          for target in "${targets[@]}"; do
            echo "::group::cargo build --release --locked --target ${target}"
            cargo build --release --locked --target "${target}"
            echo "::endgroup::"
          done

      - name: Package archives
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p dist
          IFS=',' read -r -a targets <<< "${{ matrix.rust_targets }}"
          for target in "${targets[@]}"; do
            src="target/${target}/release/${{ matrix.binary }}"
            if [[ ! -f "${src}" ]]; then
              echo "missing binary: ${src}" >&2
              exit 1
            fi
            if [[ "${{ matrix.archive }}" == "tar" ]]; then
              out="dist/teehee-${VERSION}-${target}.tar.gz"
              tar -C "target/${target}/release" -czf "${out}" "${{ matrix.binary }}"
            else
              out="dist/teehee-${VERSION}-${target}.zip"
              if command -v zip >/dev/null 2>&1; then
                (cd "target/${target}/release" && zip -9 "../../../${out}" "${{ matrix.binary }}")
              else
                pwsh -NoProfile -Command \
                  "Compress-Archive -Path '${src}' -DestinationPath '${out}' -Force"
              fi
            fi
            echo "packed ${out}"
          done

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum teehee-* > SHA256SUMS.txt
          else
            shasum -a 256 teehee-* > SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: teehee-${{ steps.meta.outputs.version }}-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # Native desktop bundles for the NSH GUI prototype. NSH builds the runner
  # for the machine it runs on, so each OS packages its own architecture.
  # Settings follow NSH's own CI (macos-15 / ubuntu-24.04 / windows-latest)
  # and https://nsh.dev/docs/packaging.
  build-gui:
    name: build GUI (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            target: macos
          - name: macos-x86_64
            os: macos-15-intel
            target: macos
          - name: linux-x86_64
            os: ubuntu-24.04
            target: linux
          - name: windows-x86_64
            os: windows-latest
            target: windows
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version label
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gui-${{ matrix.name }}

      - name: Install NSH (macOS / Linux)
        if: runner.os != 'Windows'
        env:
          NSH_VERSION: v0.6.0
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install NSH (Windows)
        if: runner.os == 'Windows'
        env:
          NSH_VERSION: v0.6.0
        shell: pwsh
        run: |
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config \
            libasound2-dev libgtk-4-dev libwebkitgtk-6.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Package GUI (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          nsh package gui --target macos \
            --app-version "${VERSION#v}" --build "$GITHUB_RUN_NUMBER" \
            -o gui-dist
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "gui-dist/teehee.app" \
            "dist/teehee-gui-${VERSION}-${{ matrix.name }}.zip"

      - name: Package GUI (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          nsh package gui --target linux \
            --app-version "${VERSION#v}" --build "$GITHUB_RUN_NUMBER" \
            -o gui-dist
          mkdir -p dist
          cp gui-dist/teehee.tar.gz \
            "dist/teehee-gui-${VERSION}-${{ matrix.name }}.tar.gz"

      - name: Package GUI (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          RUST_MIN_STACK: "268435456"
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          nsh package gui --target windows \
            --app-version "${VERSION#v}" --build "$GITHUB_RUN_NUMBER" \
            -o gui-dist
          mkdir -p dist
          cp gui-dist/teehee.zip \
            "dist/teehee-gui-${VERSION}-${{ matrix.name }}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: teehee-gui-${{ steps.meta.outputs.version }}-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release assets
        run: ls -la artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/*
